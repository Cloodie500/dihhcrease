<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D WebRTC Multiplayer Platformer</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121216;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; font-size: 24px; color: #7289da; }
        #controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input, button {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
        }
        button { background: #7289da; cursor: pointer; border: none; font-weight: bold; }
        button:hover { background: #5b6eae; }
        #game-container {
            display: flex;
            gap: 15px;
            background: #1e1e24;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        canvas {
            background: #0d0d11;
            border-radius: 4px;
            border: 2px solid #333;
        }
        #chat-container {
            width: 250px;
            height: 400px;
            display: flex;
            flex-direction: column;
            background: #18181c;
            border-radius: 4px;
            border: 1px solid #333;
            padding: 10px;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .msg { word-wrap: break-word; }
        .msg.me { color: #57f287; }
        .msg.peer { color: #eb459e; }
        .msg.sys { color: #888; font-style: italic; }
        #chat-form { display: flex; gap: 5px; }
        #chat-input { flex: 1; }
    </style>
</head>
<body>

    <h1>WebRTC 2D Multiplayer Platformer</h1>

    <div id="controls">
        <span>My ID: <strong id="my-id">Connecting...</strong></span>
        <input type="text" id="peer-id-input" placeholder="Enter Host Peer ID">
        <button id="connect-btn">Connect to Peer</button>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div id="chat-container">
            <div id="chat-box"></div>
            <form id="chat-form">
                <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
                <button type="submit">Send</button>
            </form>
        </div>
    </div>

    <script>
        // --- WebRTC SETUP (Using PeerJS) ---
        const peer = new Peer();
        let conn = null;

        const myIdEl = document.getElementById('my-id');
        const connectBtn = document.getElementById('connect-btn');
        const peerIdInput = document.getElementById('peer-id-input');
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');

        peer.on('open', (id) => {
            myIdEl.textContent = id;
            logSystemMsg("Ready! Share your ID or connect to another player.");
        });

        // Receiving incoming connection
        peer.on('connection', (c) => {
            conn = c;
            setupDataConnection();
        });

        // Host initiating outgoing connection
        connectBtn.addEventListener('click', () => {
            const peerId = peerIdInput.value.trim();
            if (peerId) {
                conn = peer.connect(peerId);
                setupDataConnection();
            }
        });

        function setupDataConnection() {
            conn.on('open', () => {
                logSystemMsg("Connected to Peer!");
                peerPlayer.active = true;
            });

            conn.on('data', (data) => {
                if (data.type === 'state') {
                    // Update peer state
                    Object.assign(peerPlayer, data.state);
                    peerPlayer.active = true;
                } else if (data.type === 'chat') {
                    appendMessage(data.text, 'peer');
                }
            });

            conn.on('close', () => {
                logSystemMsg("Peer disconnected.");
                peerPlayer.active = false;
            });
        }

        function logSystemMsg(text) {
            const div = document.createElement('div');
            div.className = 'msg sys';
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.textContent = (sender === 'me' ? 'You: ' : 'Peer: ') + text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text) return;
            appendMessage(text, 'me');
            if (conn && conn.open) {
                conn.send({ type: 'chat', text: text });
            }
            chatInput.value = '';
        });

        // --- GAME ENGINE & PHYSICS ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRAVITY = 0.5;
        const FRICTION = 0.85;

        // Level Platforms
        const platforms = [
            { x: 0, y: 360, w: 600, h: 40 }, // Ground
            { x: 100, y: 260, w: 150, h: 15 },
            { x: 350, y: 200, w: 150, h: 15 },
            { x: 200, y: 120, w: 120, h: 15 }
        ];

        // Player class handling controls, physics, and state rendering
        class Player {
            constructor(color, startX) {
                this.x = startX;
                this.y = 300;
                this.vx = 0;
                this.vy = 0;
                this.normalWidth = 24;
                this.normalHeight = 36;
                this.slideHeight = 18;
                this.w = this.normalWidth;
                this.h = this.normalHeight;
                this.color = color;
                
                this.isGrounded = false;
                this.isSliding = false;
                this.facing = 'right'; // 'left' or 'right'
                this.animFrame = 0;
                this.active = true;
            }

            update(keys) {
                // Direction tracking
                if (keys['a'] || keys['A']) this.facing = 'left';
                if (keys['d'] || keys['D']) this.facing = 'right';

                // Slide Mechanic: S key when moving horizontally on the ground
                const isMoving = Math.abs(this.vx) > 1;
                if ((keys['s'] || keys['S']) && this.isGrounded && isMoving) {
                    if (!this.isSliding) {
                        this.isSliding = true;
                        this.h = this.slideHeight;
                        this.y += (this.normalHeight - this.slideHeight); // Adjust origin down
                        // Boost impulse on slide start
                        this.vx = this.facing === 'right' ? 8 : -8;
                    }
                } else {
                    if (this.isSliding) {
                        this.isSliding = false;
                        this.y -= (this.normalHeight - this.slideHeight); // Restore origin up
                        this.h = this.normalHeight;
                    }
                }

                // Horizontal Movement (If not sliding)
                if (!this.isSliding) {
                    if (keys['a'] || keys['A']) this.vx -= 0.8;
                    if (keys['d'] || keys['D']) this.vx += 0.8;
                    this.vx *= FRICTION;
                } else {
                    // Slide friction (longer slide)
                    this.vx *= 0.96;
                }

                // Jump Mechanic: W key
                if ((keys['w'] || keys['W']) && this.isGrounded && !this.isSliding) {
                    this.vy = -10.5;
                    this.isGrounded = false;
                }

                // Apply Gravity
                this.vy += GRAVITY;

                // Move X
                this.x += this.vx;
                this.checkPlatformCollisions(true);

                // Move Y
                this.y += this.vy;
                this.isGrounded = false;
                this.checkPlatformCollisions(false);

                // Bound checking (screen edges)
                if (this.x < 0) this.x = 0;
                if (this.x + this.w > canvas.width) this.x = canvas.width - this.w;

                // Animation Frame counter
                this.animFrame += 0.15;
            }

            checkPlatformCollisions(isHorizontal) {
                for (let p of platforms) {
                    if (this.x < p.x + p.w &&
                        this.x + this.w > p.x &&
                        this.y < p.y + p.h &&
                        this.y + this.h > p.y) {
                        
                        if (isHorizontal) {
                            if (this.vx > 0) this.x = p.x - this.w;
                            if (this.vx < 0) this.x = p.x + p.w;
                            this.vx = 0;
                        } else {
                            if (this.vy > 0) {
                                this.y = p.y - this.h;
                                this.isGrounded = true;
                                this.vy = 0;
                            } else if (this.vy < 0) {
                                this.y = p.y + p.h;
                                this.vy = 0;
                            }
                        }
                    }
                }
            }

            draw(ctx) {
                if (!this.active) return;

                ctx.save();
                ctx.translate(this.x + this.w / 2, this.y + this.h / 2);

                // Stylized Hollow-Knight-esque procedural animation/drawing
                ctx.fillStyle = this.color;

                if (this.isSliding) {
                    // Slide pose (stretched & tilted rectangle with trail glow)
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color;
                    ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
                    
                    // Eyes looking forward while sliding
                    ctx.fillStyle = '#FFF';
                    const eyeX = this.facing === 'right' ? 4 : -8;
                    ctx.fillRect(eyeX, -3, 4, 4);
                } else {
                    // Floating idle/run bounce pulse
                    let bobY = 0;
                    if (this.isGrounded && Math.abs(this.vx) > 0.5) {
                        bobY = Math.sin(this.animFrame * 2) * 2; // Running bob
                    } else if (!this.isGrounded) {
                        bobY = -2; // Jump stretch
                    }

                    // Body Cloak
                    ctx.fillRect(-this.w / 2, -this.h / 2 + bobY, this.w, this.h);

                    // Head/Eyes (Hollow Knight mask aesthetic)
                    ctx.fillStyle = '#FFFFFF';
                    const eyeOffset = this.facing === 'right' ? 3 : -7;
                    
                    // Eyes (Glows when moving)
                    ctx.fillRect(-4 + eyeOffset, -this.h / 2 + 6 + bobY, 4, 6);
                    ctx.fillRect(3 + eyeOffset, -this.h / 2 + 6 + bobY, 4, 6);

                    // Horns/Mask details
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.moveTo(-this.w / 2, -this.h / 2 + bobY);
                    ctx.lineTo(-this.w / 2 - 3, -this.h / 2 - 8 + bobY);
                    ctx.lineTo(-2, -this.h / 2 + bobY);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(this.w / 2, -this.h / 2 + bobY);
                    ctx.lineTo(this.w / 2 + 3, -this.h / 2 - 8 + bobY);
                    ctx.lineTo(2, -this.h / 2 + bobY);
                    ctx.fill();
                }

                ctx.restore();
            }

            // Simple state serializing for WebRTC syncing
            getState() {
                return {
                    x: this.x,
                    y: this.y,
                    w: this.w,
                    h: this.h,
                    facing: this.facing,
                    isSliding: this.isSliding,
                    animFrame: this.animFrame
                };
            }
        }

        const localPlayer = new Player('#7289da', 50);
        const peerPlayer = new Player('#eb459e', 500);
        peerPlayer.active = false; // Hide until peer connects

        // Keyboard tracking
        const keys = {};
        window.addEventListener('keydown', (e) => { 
            // Avoid intercepting keystrokes if focused on the chat input
            if (document.activeElement === chatInput) return;
            keys[e.key] = true; 
        });
        window.addEventListener('keyup', (e) => { 
            if (document.activeElement === chatInput) return;
            keys[e.key] = false; 
        });

        // Main Game Loop
        function gameLoop() {
            // 1. Update local player physics
            localPlayer.update(keys);

            // 2. Transmit local player state to peer via WebRTC
            if (conn && conn.open) {
                conn.send({
                    type: 'state',
                    state: localPlayer.getState()
                });
            }

            // 3. Render Canvas frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Render platforms
            ctx.fillStyle = '#2a2a35';
            ctx.strokeStyle = '#444455';
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeRect(p.x, p.y, p.w, p.h);
            });

            // Render players
            localPlayer.draw(ctx);
            peerPlayer.draw(ctx);

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
