<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC Chat</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
    #chat-box { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
    .msg { margin: 5px 0; }
    .system { color: gray; font-style: italic; }
    .inputs { display: flex; gap: 5px; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 12px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>WebRTC P2P Chat</h2>
  
  <div>
    <p><strong>Your Peer ID:</strong> <span id="my-id">Generating...</span></p>
    <div class="inputs">
      <input type="text" id="friend-id-input" placeholder="Enter Friend's Peer ID">
      <button id="connect-btn">Connect</button>
    </div>
  </div>

  <hr>

  <div id="chat-box"></div>

  <div class="inputs">
    <input type="text" id="message-input" placeholder="Type a message..." disabled>
    <button id="send-btn" disabled>Send</button>
  </div>

  <script>
    const originalTitle = "WebRTC Chat";
    let unreadCount = 0;
    let peer = new Peer();
    let conn = null;

    // DOM Elements
    const myIdEl = document.getElementById('my-id');
    const friendIdInput = document.getElementById('friend-id-input');
    const connectBtn = document.getElementById('connect-btn');
    const chatBox = document.getElementById('chat-box');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');

    // 1. Display your generated Peer ID
    peer.on('open', (id) => {
      myIdEl.textContent = id;
    });

    // 2. Handle incoming connection (Host side)
    peer.on('connection', (incomingConn) => {
      conn = incomingConn;
      setupChat();
      appendMessage("System", "Friend connected!", true);
    });

    // 3. Connect to a friend (Joiner side)
    connectBtn.addEventListener('click', () => {
      const friendId = friendIdInput.value.trim();
      if (friendId) {
        conn = peer.connect(friendId);
        setupChat();
        appendMessage("System", "Connecting to friend...", true);
      }
    });

    // 4. Set up message event listeners once connected
    function setupChat() {
      conn.on('open', () => {
        appendMessage("System", "Connected and ready to chat!", true);
        messageInput.disabled = false;
        sendBtn.disabled = false;
      });

      conn.on('data', (data) => {
        appendMessage("Friend", data);
        handleUnreadCount();
      });
    }

    // 5. Send message logic
    function sendMessage() {
      const text = messageInput.value.trim();
      if (text && conn) {
        conn.send(text);
        appendMessage("You", text);
        messageInput.value = '';
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Helper: Display messages in chat window
    function appendMessage(sender, text, isSystem = false) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('msg');
      if (isSystem) msgDiv.classList.add('system');
      msgDiv.textContent = isSystem ? text : `${sender}: ${text}`;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 6. Title Notification Logic for New Messages
    function handleUnreadCount() {
      unreadCount++;
      document.title = `(${unreadCount}) ${originalTitle}`;
    }

    // Clear unread count when user clicks into or focuses on the window
    window.addEventListener('focus', () => {
      unreadCount = 0;
      document.title = originalTitle;
    });
  </script>
</body>
</html>
