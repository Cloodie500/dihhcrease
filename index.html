<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Dark Chat</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-dark: #1e293b;
      --border-dark: #334155;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --msg-mine: #4f46e5;
      --msg-friend: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }

    /* Fullscreen App Layout */
    .app-container { display: flex; width: 100vw; height: 100vh; }

    /* Left Sidebar / Contacts Panel */
    .sidebar { width: 320px; background: var(--panel-dark); border-right: 1px solid var(--border-dark); display: flex; flex-direction: column; flex-shrink: 0; }
    
    .profile-section { padding: 16px; border-bottom: 1px solid var(--border-dark); display: flex; flex-direction: column; gap: 10px; }
    .profile-header { display: flex; align-items: center; gap: 12px; }
    .avatar-preview { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #475569; border: 2px solid var(--accent); }
    
    .file-input-wrapper { font-size: 0.75rem; color: var(--text-muted); }
    input[type="file"] { display: none; }
    .custom-file-upload { display: inline-block; padding: 4px 8px; background: var(--border-dark); border-radius: 4px; cursor: pointer; font-size: 0.75rem; transition: 0.2s; }
    .custom-file-upload:hover { background: var(--accent); }

    .inputs { display: flex; flex-direction: column; gap: 8px; }
    input[type="text"] { background: var(--bg-dark); border: 1px solid var(--border-dark); color: var(--text-main); padding: 8px 12px; border-radius: 6px; outline: none; font-size: 0.9rem; }
    input[type="text"]:focus { border-color: var(--accent); }

    .btn { background: var(--accent); color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: var(--accent-hover); }

    .my-pin-badge { font-size: 0.8rem; color: var(--text-muted); background: var(--bg-dark); padding: 6px; border-radius: 6px; text-align: center; }
    .my-pin-badge span { color: var(--accent); font-weight: bold; letter-spacing: 1px; }

    /* Contacts / Dynamic Chat Tabs List */
    .contacts-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .contact-tab { padding: 14px 16px; border-bottom: 1px solid var(--border-dark); display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.2s, transform 0.1s; animation: slideIn 0.3s ease-out; }
    .contact-tab:hover { background: #2d3748; }
    .contact-tab.active { background: #334155; border-left: 4px solid var(--accent); }
    
    .tab-info { flex: 1; overflow: hidden; }
    .tab-name { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab-status { font-size: 0.75rem; color: var(--text-muted); }
    .unread-badge { background: var(--accent); color: white; font-size: 0.7rem; font-weight: bold; padding: 2px 7px; border-radius: 10px; display: none; }

    /* Main Chat Window (Right Side) */
    .chat-window { flex: 1; display: flex; flex-direction: column; background: var(--bg-dark); }
    .chat-header { padding: 16px; background: var(--panel-dark); border-bottom: 1px solid var(--border-dark); display: flex; align-items: center; gap: 12px; }

    .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }

    /* Message Bubbles & Animations */
    @keyframes popIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-15px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .msg-wrapper { display: flex; gap: 10px; max-width: 70%; animation: popIn 0.25s cubic-bezier(0.1, 0.9, 0.2, 1); }
    .msg-wrapper.mine { align-self: flex-end; flex-direction: row-reverse; }
    .msg-wrapper.friend { align-self: flex-start; }

    .msg-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #475569; flex-shrink: 0; }
    .msg-bubble { padding: 10px 14px; border-radius: 14px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
    .mine .msg-bubble { background: var(--msg-mine); color: white; border-bottom-right-radius: 2px; }
    .friend .msg-bubble { background: var(--msg-friend); color: var(--text-main); border-bottom-left-radius: 2px; }

    .msg-image { max-width: 250px; max-height: 200px; border-radius: 8px; margin-top: 6px; display: block; }

    .system-msg { align-self: center; font-size: 0.8rem; color: var(--text-muted); background: var(--panel-dark); padding: 4px 12px; border-radius: 12px; border: 1px solid var(--border-dark); }

    /* Footer Inputs */
    .chat-footer { padding: 16px; background: var(--panel-dark); border-top: 1px solid var(--border-dark); display: flex; gap: 10px; align-items: center; }
    .chat-footer input[type="text"] { flex: 1; padding: 12px; }

    .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-muted); flex-direction: column; gap: 10px; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="sidebar">
      <div class="profile-section">
        <div class="profile-header">
          <img id="my-avatar-preview" class="avatar-preview" src="https://api.dicebear.com/7.x/bottts/svg?seed=Me" alt="Avatar">
          <div style="flex:1;">
            <input type="text" id="username-input" value="User" placeholder="Your Name">
            <div class="file-input-wrapper" style="margin-top: 4px;">
              <label for="avatar-file" class="custom-file-upload">Upload Avatar</label>
              <input type="file" id="avatar-file" accept="image/*">
            </div>
          </div>
        </div>

        <div class="my-pin-badge">
          Your PIN: <span id="my-pin">Generating...</span>
        </div>

        <div class="inputs">
          <input type="text" id="join-pin-input" placeholder="Enter 6-Digit PIN" maxlength="6">
          <button class="btn" id="connect-btn">Connect & Open Tab</button>
        </div>
      </div>

      <div class="contacts-list" id="contacts-list"></div>
    </div>

    <div class="chat-window" id="chat-window">
      <div class="empty-state" id="empty-state">
        <h2>No Active Chat Selected</h2>
        <p>Enter a 6-digit PIN on the left to start a new chat tab.</p>
      </div>

      <div id="active-chat-content" style="display: none; height: 100%; flex-direction: column;">
        <div class="chat-header">
          <img id="active-avatar" class="avatar-preview" src="" alt="Avatar">
          <div>
            <div id="active-title" style="font-weight: bold;">Friend Name</div>
            <div id="active-status" style="font-size:0.75rem; color: var(--text-muted);">Connected</div>
          </div>
        </div>

        <div class="messages-container" id="messages-container"></div>

        <div class="chat-footer">
          <label for="chat-image-file" class="custom-file-upload">📎 Image</label>
          <input type="file" id="chat-image-file" accept="image/*">
          <input type="text" id="message-input" placeholder="Type a message...">
          <button class="btn" id="send-btn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const originalTitle = "P2P Dark Chat";
    let unreadCount = 0;
    let peer = null;
    let chats = {}; // Stores chat sessions by Peer ID
    let activePeerId = null;
    let myAvatarData = "https://api.dicebear.com/7.x/bottts/svg?seed=Me";

    // Sound Notification Synthesizer (Web Audio API - No external file needed)
    function playNotificationSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1); // A5
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch (e) { /* Audio context blocked by browser policy until user click */ }
    }

    // 1. PIN & PeerJS Setup
    const myPin = Math.floor(100000 + Math.random() * 900000).toString();
    document.getElementById('my-pin').textContent = myPin;
    peer = new Peer(myPin);

    // 2. Avatar File Upload Handler
    document.getElementById('avatar-file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          myAvatarData = event.target.result;
          document.getElementById('my-avatar-preview').src = myAvatarData;
        };
        reader.readAsDataURL(file);
      }
    });

    // 3. Handle Connections
    peer.on('connection', (conn) => {
      setupChatSession(conn, false);
    });

    document.getElementById('connect-btn').addEventListener('click', () => {
      const pin = document.getElementById('join-pin-input').value.trim();
      if (pin.length === 6) {
        if (chats[pin]) {
          switchTab(pin);
          return;
        }
        const conn = peer.connect(pin);
        setupChatSession(conn, true);
        document.getElementById('join-pin-input').value = '';
      } else {
        alert("Enter a 6-digit PIN.");
      }
    });

    // 4. Initialize & Track Sessions
    function setupChatSession(conn, isInitiator) {
      const targetId = conn.peer;

      chats[targetId] = {
        conn: conn,
        username: `PIN: ${targetId}`,
        avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=' + targetId,
        messages: [],
        unread: 0
      };

      createSidebarTab(targetId);

      conn.on('open', () => {
        addSystemMessage(targetId, "Connection established!");
        // Auto-switch tab if user initiated connection
        if (isInitiator) switchTab(targetId);
      });

      conn.on('data', (payload) => {
        // Update user profile info on data received
        chats[targetId].username = payload.username;
        chats[targetId].avatar = payload.avatar;
        updateTabUI(targetId);

        chats[targetId].messages.push({ sender: 'friend', payload: payload });

        if (activePeerId === targetId && !document.hidden) {
          renderMessage(payload, false);
        } else {
          chats[targetId].unread++;
          updateTabUI(targetId);
          handleGlobalUnread();
        }
        playNotificationSound();
      });

      conn.on('close', () => {
        addSystemMessage(targetId, "Friend disconnected.");
      });
    }

    // 5. Sidebar UI Tab Management
    function createSidebarTab(peerId) {
      const list = document.getElementById('contacts-list');
      const tab = document.createElement('div');
      tab.classList.add('contact-tab');
      tab.id = `tab-${peerId}`;
      
      tab.innerHTML = `
        <img class="avatar-preview" id="avatar-${peerId}" src="${chats[peerId].avatar}">
        <div class="tab-info">
          <div class="tab-name" id="name-${peerId}">${chats[peerId].username}</div>
          <div class="tab-status">Click to switch</div>
        </div>
        <div class="unread-badge" id="unread-${peerId}">0</div>
      `;

      tab.addEventListener('click', () => switchTab(peerId));
      // Prepend to top (left side requirement)
      list.insertBefore(tab, list.firstChild);
    }

    function updateTabUI(peerId) {
      const nameEl = document.getElementById(`name-${peerId}`);
      const avatarEl = document.getElementById(`avatar-${peerId}`);
      const unreadEl = document.getElementById(`unread-${peerId}`);

      if (nameEl) nameEl.textContent = chats[peerId].username;
      if (avatarEl) avatarEl.src = chats[peerId].avatar;
      
      if (unreadEl) {
        if (chats[peerId].unread > 0) {
          unreadEl.textContent = chats[peerId].unread;
          unreadEl.style.display = 'block';
        } else {
          unreadEl.style.display = 'none';
        }
      }
    }

    function switchTab(peerId) {
      activePeerId = peerId;
      chats[peerId].unread = 0;
      updateTabUI(peerId);

      // Highlight active tab
      document.querySelectorAll('.contact-tab').forEach(t => t.classList.remove('active'));
      document.getElementById(`tab-${peerId}`).classList.add('active');

      // Update Screen
      document.getElementById('empty-state').style.display = 'none';
      const activeWindow = document.getElementById('active-chat-content');
      activeWindow.style.display = 'flex';

      document.getElementById('active-title').textContent = chats[peerId].username;
      document.getElementById('active-avatar').src = chats[peerId].avatar;

      // Render All Messages
      const container = document.getElementById('messages-container');
      container.innerHTML = '';
      chats[peerId].messages.forEach(msg => {
        if (msg.system) {
          renderSystemMsgUI(msg.text);
        } else {
          renderMessage(msg.payload, msg.sender === 'mine');
        }
      });
      container.scrollTop = container.scrollHeight;
    }

    // 6. Sending Messages & Images
    function sendMessage() {
      if (!activePeerId || !chats[activePeerId]) return;

      const textInput = document.getElementById('message-input');
      const imageInput = document.getElementById('chat-image-file');
      const text = textInput.value.trim();
      const file = imageInput.files[0];

      if (!text && !file) return;

      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          dispatchPayload(text, e.target.result);
        };
        reader.readAsDataURL(file);
        imageInput.value = ''; // Reset image input
      } else {
        dispatchPayload(text, null);
      }

      textInput.value = '';
    }

    function dispatchPayload(text, imageBase64) {
      const payload = {
        username: document.getElementById('username-input').value.trim() || 'Anonymous',
        avatar: myAvatarData,
        text: text,
        image: imageBase64
      };

      chats[activePeerId].conn.send(payload);
      chats[activePeerId].messages.push({ sender: 'mine', payload: payload });
      renderMessage(payload, true);
    }

    document.getElementById('send-btn').addEventListener('click', sendMessage);
    document.getElementById('message-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // 7. Render UI Helpers
    function renderMessage(payload, isMine) {
      const container = document.getElementById('messages-container');
      const wrapper = document.createElement('div');
      wrapper.classList.add('msg-wrapper', isMine ? 'mine' : 'friend');

      let imgHTML = payload.image ? `<img src="${payload.image}" class="msg-image"/>` : '';
      let textHTML = payload.text ? `<div>${payload.text}</div>` : '';

      wrapper.innerHTML = `
        <img class="msg-avatar" src="${payload.avatar}">
        <div>
          <div class="msg-bubble">
            ${textHTML}
            ${imgHTML}
          </div>
        </div>
      `;

      container.appendChild(wrapper);
      container.scrollTop = container.scrollHeight;
    }

    function addSystemMessage(peerId, text) {
      chats[peerId].messages.push({ system: true, text: text });
      if (activePeerId === peerId) {
        renderSystemMsgUI(text);
      }
    }

    function renderSystemMsgUI(text) {
      const container = document.getElementById('messages-container');
      const sysDiv = document.createElement('div');
      sysDiv.classList.add('system-msg');
      sysDiv.textContent = text;
      container.appendChild(sysDiv);
      container.scrollTop = container.scrollHeight;
    }

    // 8. Global Unread Notifications
    function handleGlobalUnread() {
      if (document.hidden) {
        unreadCount++;
        document.title = `(${unreadCount}) ${originalTitle}`;
      }
    }

    window.addEventListener('focus', () => {
      unreadCount = 0;
      document.title = originalTitle;
    });
  </script>
</body>
</html>
