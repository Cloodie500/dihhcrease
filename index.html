<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D WebRTC Multiplayer Platformer</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121216;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        h1 { margin-bottom: 10px; font-size: 22px; color: #7289da; }
        
        /* Top Control Bar */
        #controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: #1e1e24;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        input, select, button {
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            font-size: 13px;
        }
        input[type="color"] {
            padding: 2px;
            width: 32px;
            height: 28px;
            cursor: pointer;
        }
        button { background: #7289da; cursor: pointer; border: none; font-weight: bold; }
        button:hover { background: #5b6eae; }
        button.active { background: #43b581; }

        /* Main Game Layout */
        #game-container {
            display: flex;
            gap: 15px;
            background: #1e1e24;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        canvas {
            background: #0d0d11;
            border-radius: 4px;
            border: 2px solid #333;
        }
        
        /* Chat Container */
        #chat-container {
            width: 280px;
            height: 550px;
            display: flex;
            flex-direction: column;
            background: #18181c;
            border-radius: 4px;
            border: 1px solid #333;
            padding: 10px;
        }
        #chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #333;
            font-size: 13px;
            font-weight: bold;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .msg { word-wrap: break-word; line-height: 1.3; }
        .msg.sys { color: #888; font-style: italic; }
        #chat-form { display: flex; gap: 5px; }
        #chat-input { flex: 1; }
    </style>
</head>
<body>

    <h1>WebRTC 2D Multiplayer Platformer</h1>

    <div id="controls-bar">
        <div class="control-group">
            <label>ID:</label>
            <strong id="my-id" style="color: #7289da;">Connecting...</strong>
        </div>
        <div class="control-group">
            <input type="text" id="peer-id-input" placeholder="Host Peer ID">
            <button id="connect-btn">Connect</button>
        </div>
        <div class="control-group">
            <label>Name:</label>
            <input type="text" id="username-input" value="Knight" style="width: 90px;">
        </div>
        <div class="control-group">
            <label>Tag:</label>
            <input type="color" id="tag-color-input" value="#ffffff">
        </div>
        <div class="control-group">
            <label>Body:</label>
            <input type="color" id="model-color-input" value="#7289da">
            <select id="body-style-input">
                <option value="knight">Knight</option>
                <option value="blob">Blob</option>
                <option value="robot">Robot</option>
            </select>
        </div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="900" height="550"></canvas>
        <div id="chat-container">
            <div id="chat-header">
                <span>Chat</span>
                <button id="notify-toggle-btn" style="font-size: 11px; padding: 3px 6px;">Enable Desktop Alerts</button>
            </div>
            <div id="chat-box"></div>
            <form id="chat-form">
                <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
                <button type="submit">Send</button>
            </form>
        </div>
    </div>

    <script>
        // --- DESKTOP NOTIFICATIONS SETUP ---
        let notificationsEnabled = false;
        const notifyBtn = document.getElementById('notify-toggle-btn');

        notifyBtn.addEventListener('click', () => {
            if (!("Notification" in window)) {
                alert("Desktop notifications are not supported by your browser.");
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    notificationsEnabled = true;
                    notifyBtn.textContent = "Alerts Active";
                    notifyBtn.classList.add('active');
                } else {
                    alert("Notification permission was denied.");
                }
            });
        });

        function sendDesktopNotification(title, body) {
            if (notificationsEnabled && document.hidden) {
                new Notification(title, {
                    body: body,
                    icon: 'https://github.githubassets.com/favicons/favicon.png'
                });
            }
        }

        // --- WEBRTC SETUP (PeerJS) ---
        const peer = new Peer();
        let conn = null;

        const myIdEl = document.getElementById('my-id');
        const connectBtn = document.getElementById('connect-btn');
        const peerIdInput = document.getElementById('peer-id-input');
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');

        peer.on('open', (id) => {
            myIdEl.textContent = id;
            logSystemMsg("Ready! Share your ID or connect to another player.");
        });

        peer.on('connection', (c) => {
            conn = c;
            setupDataConnection();
        });

        connectBtn.addEventListener('click', () => {
            const peerId = peerIdInput.value.trim();
            if (peerId) {
                conn = peer.connect(peerId);
                setupDataConnection();
            }
        });

        function setupDataConnection() {
            conn.on('open', () => {
                logSystemMsg("Connected to Peer!");
                peerPlayer.active = true;
            });

            conn.on('data', (data) => {
                if (data.type === 'state') {
                    Object.assign(peerPlayer, data.state);
                    peerPlayer.active = true;
                } else if (data.type === 'chat') {
                    appendMessage(data.sender, data.text, data.tagColor, 'peer');
                    sendDesktopNotification(`Message from ${data.sender}`, data.text);
                } else if (data.type === 'punch_hit') {
                    // Received knockback pulse from peer
                    localPlayer.applyKnockback(data.direction);
                }
            });

            conn.on('close', () => {
                logSystemMsg("Peer disconnected.");
                peerPlayer.active = false;
            });
        }

        function logSystemMsg(text) {
            const div = document.createElement('div');
            div.className = 'msg sys';
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessage(sender, text, tagColor, type) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            
            const nameSpan = document.createElement('strong');
            nameSpan.style.color = tagColor || '#ffffff';
            nameSpan.textContent = sender + ": ";

            const textSpan = document.createElement('span');
            textSpan.textContent = text;

            div.appendChild(nameSpan);
            div.appendChild(textSpan);
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text) return;
            
            const username = document.getElementById('username-input').value.trim() || 'Player';
            const tagColor = document.getElementById('tag-color-input').value;

            appendMessage("You (" + username + ")", text, tagColor, 'me');

            if (conn && conn.open) {
                conn.send({
                    type: 'chat',
                    sender: username,
                    tagColor: tagColor,
                    text: text
                });
            }
            chatInput.value = '';
        });

        // --- GAME ENGINE & MAP PHYSICS ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRAVITY = 0.5;
        const FRICTION = 0.85;

        // Expanded Map Layout
        const platforms = [
            { x: 0, y: 510, w: 900, h: 40 }, // Ground
            { x: 80, y: 400, w: 200, h: 15 },
            { x: 620, y: 400, w: 200, h: 15 },
            { x: 350, y: 320, w: 200, h: 15 },
            { x: 150, y: 210, w: 180, h: 15 },
            { x: 570, y: 210, w: 180, h: 15 },
            { x: 380, y: 110, w: 140, h: 15 }
        ];

        class Player {
            constructor(startX) {
                this.x = startX;
                this.y = 400;
                this.vx = 0;
                this.vy = 0;
                this.normalWidth = 26;
                this.normalHeight = 38;
                this.slideHeight = 20;
                this.w = this.normalWidth;
                this.h = this.normalHeight;
                
                // Customization fields
                this.username = 'Player';
                this.tagColor = '#ffffff';
                this.modelColor = '#7289da';
                this.bodyStyle = 'knight';

                this.isGrounded = false;
                this.isSliding = false;
                this.facing = 'right';
                this.animFrame = 0;
                this.active = true;

                // Combat properties
                this.punchCooldown = 0; // Frames remaining
                this.isPunching = false;
                this.punchAnimTimer = 0;
            }

            update(keys) {
                // Read local UI settings
                this.username = document.getElementById('username-input').value.trim() || 'Player';
                this.tagColor = document.getElementById('tag-color-input').value;
                this.modelColor = document.getElementById('model-color-input').value;
                this.bodyStyle = document.getElementById('body-style-input').value;

                // Punch Cooldown Ticker
                if (this.punchCooldown > 0) this.punchCooldown--;
                if (this.punchAnimTimer > 0) {
                    this.punchAnimTimer--;
                } else {
                    this.isPunching = false;
                }

                // Punching Trigger (SPACE)
                if (keys[' '] && this.punchCooldown === 0) {
                    this.isPunching = true;
                    this.punchAnimTimer = 12; // Anim duration (frames)
                    this.punchCooldown = 180; // 3 second cooldown (60 fps * 3)
                    this.checkPunchHit();
                }

                // Movement Inputs
                if (keys['a'] || keys['A']) this.facing = 'left';
                if (keys['d'] || keys['D']) this.facing = 'right';

                // Slide Mechanic
                const isMoving = Math.abs(this.vx) > 1;
                if ((keys['s'] || keys['S']) && this.isGrounded && isMoving) {
                    if (!this.isSliding) {
                        this.isSliding = true;
                        this.h = this.slideHeight;
                        this.y += (this.normalHeight - this.slideHeight);
                        this.vx = this.facing === 'right' ? 8.5 : -8.5;
                    }
                } else {
                    if (this.isSliding) {
                        this.isSliding = false;
                        this.y -= (this.normalHeight - this.slideHeight);
                        this.h = this.normalHeight;
                    }
                }

                // Horizontal Movement
                if (!this.isSliding) {
                    if (keys['a'] || keys['A']) this.vx -= 0.85;
                    if (keys['d'] || keys['D']) this.vx += 0.85;
                    this.vx *= FRICTION;
                } else {
                    this.vx *= 0.96;
                }

                // Jump Mechanic
                if ((keys['w'] || keys['W']) && this.isGrounded && !this.isSliding) {
                    this.vy = -10.8;
                    this.isGrounded = false;
                }

                // Apply Gravity
                this.vy += GRAVITY;

                // Axis Collisions
                this.x += this.vx;
                this.checkPlatformCollisions(true);

                this.y += this.vy;
                this.isGrounded = false;
                this.checkPlatformCollisions(false);

                // Screen Boundary
                if (this.x < 0) this.x = 0;
                if (this.x + this.w > canvas.width) this.x = canvas.width - this.w;

                this.animFrame += 0.15;
            }

            checkPunchHit() {
                if (!peerPlayer.active) return;

                // Punch Hitbox bounds calculation
                const reach = 35;
                const punchX = this.facing === 'right' ? this.x + this.w : this.x - reach;
                const punchY = this.y;

                // Intersection test with peer player
                if (punchX < peerPlayer.x + peerPlayer.w &&
                    punchX + reach > peerPlayer.x &&
                    punchY < peerPlayer.y + peerPlayer.h &&
                    punchY + this.h > peerPlayer.y) {
                    
                    // Direct peer knockback event transmission
                    if (conn && conn.open) {
                        conn.send({
                            type: 'punch_hit',
                            direction: this.facing
                        });
                    }
                }
            }

            applyKnockback(direction) {
                const force = direction === 'right' ? 10 : -10;
                this.vx = force;
                this.vy = -5; // Vertical pop
                this.isGrounded = false;
            }

            checkPlatformCollisions(isHorizontal) {
                for (let p of platforms) {
                    if (this.x < p.x + p.w &&
                        this.x + this.w > p.x &&
                        this.y < p.y + p.h &&
                        this.y + this.h > p.y) {
                        
                        if (isHorizontal) {
                            if (this.vx > 0) this.x = p.x - this.w;
                            if (this.vx < 0) this.x = p.x + p.w;
                            this.vx = 0;
                        } else {
                            if (this.vy > 0) {
                                this.y = p.y - this.h;
                                this.isGrounded = true;
                                this.vy = 0;
                            } else if (this.vy < 0) {
                                this.y = p.y + p.h;
                                this.vy = 0;
                            }
                        }
                    }
                }
            }

            draw(ctx) {
                if (!this.active) return;

                ctx.save();
                
                // --- 1. Draw Player Nametag & Cooldown Bar ---
                ctx.font = '12px Segoe UI, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillStyle = this.tagColor;
                ctx.fillText(this.username, this.x + this.w / 2, this.y - 12);

                // Draw Punch Cooldown Bar (For Local Player)
                if (this === localPlayer && this.punchCooldown > 0) {
                    const barW = 30;
                    const barH = 4;
                    const progress = 1 - (this.punchCooldown / 180);
                    ctx.fillStyle = '#444';
                    ctx.fillRect(this.x + this.w / 2 - barW / 2, this.y - 8, barW, barH);
                    ctx.fillStyle = '#7289da';
                    ctx.fillRect(this.x + this.w / 2 - barW / 2, this.y - 8, barW * progress, barH);
                }

                // --- 2. Render Player Model Body Types ---
                ctx.translate(this.x + this.w / 2, this.y + this.h / 2);

                let bobY = 0;
                if (this.isGrounded && Math.abs(this.vx) > 0.5 && !this.isSliding) {
                    bobY = Math.sin(this.animFrame * 2) * 2;
                }

                ctx.fillStyle = this.modelColor;

                if (this.bodyStyle === 'knight') {
                    // Knight Model
                    ctx.fillRect(-this.w / 2, -this.h / 2 + bobY, this.w, this.h);
                    ctx.fillStyle = '#FFFFFF';
                    const eyeOffset = this.facing === 'right' ? 3 : -7;
                    ctx.fillRect(-4 + eyeOffset, -this.h / 2 + 6 + bobY, 4, 6);
                    ctx.fillRect(3 + eyeOffset, -this.h / 2 + 6 + bobY, 4, 6);
                    
                    // Horns
                    ctx.fillStyle = this.modelColor;
                    ctx.beginPath();
                    ctx.moveTo(-this.w / 2, -this.h / 2 + bobY);
                    ctx.lineTo(-this.w / 2 - 4, -this.h / 2 - 8 + bobY);
                    ctx.lineTo(-2, -this.h / 2 + bobY);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(this.w / 2, -this.h / 2 + bobY);
                    ctx.lineTo(this.w / 2 + 4, -this.h / 2 - 8 + bobY);
                    ctx.lineTo(2, -this.h / 2 + bobY);
                    ctx.fill();

                } else if (this.bodyStyle === 'blob') {
                    // Blob Model
                    ctx.beginPath();
                    ctx.ellipse(0, bobY, this.w / 2, this.h / 2, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Eyes
                    ctx.fillStyle = '#FFF';
                    const eyeX = this.facing === 'right' ? 4 : -8;
                    ctx.fillRect(eyeX, -4 + bobY, 4, 4);

                } else if (this.bodyStyle === 'robot') {
                    // Robot Model
                    ctx.fillRect(-this.w / 2, -this.h / 2 + bobY, this.w, this.h);
                    ctx.fillStyle = '#333';
                    ctx.fillRect(-this.w / 2 + 3, -this.h / 2 + 6 + bobY, this.w - 6, 8);
                    
                    // Glowing Visor
                    ctx.fillStyle = '#00ffcc';
                    const visorX = this.facing === 'right' ? 0 : -6;
                    ctx.fillRect(visorX, -this.h / 2 + 8 + bobY, 6, 4);
                }

                // --- 3. Draw Punch Animation Effect ---
                if (this.isPunching) {
                    ctx.fillStyle = '#ffcc00';
                    const punchDir = this.facing === 'right' ? 1 : -1;
                    ctx.fillRect(punchDir * (this.w / 2), -4, punchDir * 18, 8);
                }

                ctx.restore();
            }

            // Sync Payload
            getState() {
                return {
                    x: this.x,
                    y: this.y,
                    w: this.w,
                    h: this.h,
                    facing: this.facing,
                    isSliding: this.isSliding,
                    isPunching: this.isPunching,
                    username: this.username,
                    tagColor: this.tagColor,
                    modelColor: this.modelColor,
                    bodyStyle: this.bodyStyle,
                    animFrame: this.animFrame
                };
            }
        }

        const localPlayer = new Player(100);
        const peerPlayer = new Player(750);
        peerPlayer.active = false;

        // Input Handling
        const keys = {};
        window.addEventListener('keydown', (e) => { 
            if (document.activeElement === chatInput || document.activeElement.tagName === 'INPUT') return;
            keys[e.key] = true; 
        });
        window.addEventListener('keyup', (e) => { 
            if (document.activeElement === chatInput || document.activeElement.tagName === 'INPUT') return;
            keys[e.key] = false; 
        });

        // Game Loop
        function gameLoop() {
            localPlayer.update(keys);

            // Sync state across WebRTC
            if (conn && conn.open) {
                conn.send({
                    type: 'state',
                    state: localPlayer.getState()
                });
            }

            // Clear Screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Platforms
            ctx.fillStyle = '#22222d';
            ctx.strokeStyle = '#444455';
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeRect(p.x, p.y, p.w, p.h);
            });

            // Draw Players
            localPlayer.draw(ctx);
            peerPlayer.draw(ctx);

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
