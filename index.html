<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Universal WebRTC Chat</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    /* Default Theme: Dark */
    :root {
      --bg-dark: #0f172a;
      --panel-dark: #1e293b;
      --border-dark: #334155;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --msg-mine: #4f46e5;
      --msg-friend: #334155;
    }

    /* Midnight Theme */
    body.theme-midnight {
      --bg-dark: #000000;
      --panel-dark: #111111;
      --border-dark: #222222;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #ffffff;
      --text-muted: #888888;
      --msg-mine: #2563eb;
      --msg-friend: #222222;
    }

    /* Cyberpunk Theme */
    body.theme-cyberpunk {
      --bg-dark: #0d0221;
      --panel-dark: #0f0826;
      --border-dark: #261454;
      --accent: #ff007f;
      --accent-hover: #d6006b;
      --text-main: #00f6ff;
      --text-muted: #8a64d6;
      --msg-mine: #ff007f;
      --msg-friend: #261454;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; transition: background 0.3s, color 0.3s; }

    /* Fullscreen App Layout */
    .app-container { display: flex; width: 100vw; height: 100vh; }

    /* Sidebar */
    .sidebar { width: 340px; background: var(--panel-dark); border-right: 1px solid var(--border-dark); display: flex; flex-direction: column; flex-shrink: 0; }
    
    .profile-section { padding: 16px; border-bottom: 1px solid var(--border-dark); display: flex; flex-direction: column; gap: 10px; }
    .profile-header { display: flex; align-items: center; gap: 12px; }
    .avatar-preview { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #475569; border: 2px solid var(--accent); }
    
    input[type="file"] { display: none; }
    .custom-file-upload { display: inline-block; padding: 6px 10px; background: var(--border-dark); border-radius: 6px; cursor: pointer; font-size: 0.75rem; transition: 0.2s; color: var(--text-main); }
    .custom-file-upload:hover { background: var(--accent); color: #fff; }

    .inputs { display: flex; flex-direction: column; gap: 8px; }
    input[type="text"], select { background: var(--bg-dark); border: 1px solid var(--border-dark); color: var(--text-main); padding: 8px 12px; border-radius: 6px; outline: none; font-size: 0.9rem; }
    input[type="text"]:focus, select:focus { border-color: var(--accent); }

    .btn { background: var(--accent); color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: var(--accent-hover); }

    .my-pin-badge { font-size: 0.8rem; color: var(--text-muted); background: var(--bg-dark); padding: 6px; border-radius: 6px; text-align: center; }
    .my-pin-badge span { color: var(--accent); font-weight: bold; letter-spacing: 1px; }

    .theme-selector { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-muted); }

    /* Contacts List */
    .contacts-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .contact-tab { padding: 14px 16px; border-bottom: 1px solid var(--border-dark); display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s; }
    .contact-tab:hover { background: var(--border-dark); }
    .contact-tab.active { background: var(--border-dark); border-left: 4px solid var(--accent); }
    
    .tab-info { flex: 1; overflow: hidden; }
    .tab-name { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .unread-badge { background: var(--accent); color: white; font-size: 0.7rem; font-weight: bold; padding: 2px 7px; border-radius: 10px; display: none; }

    /* Chat Area */
    .chat-window { flex: 1; display: flex; flex-direction: column; background: var(--bg-dark); }
    .chat-header { padding: 16px; background: var(--panel-dark); border-bottom: 1px solid var(--border-dark); display: flex; align-items: center; gap: 12px; }

    .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }

    .msg-wrapper { display: flex; gap: 10px; max-width: 75%; animation: popIn 0.25s cubic-bezier(0.1, 0.9, 0.2, 1); }
    .msg-wrapper.mine { align-self: flex-end; flex-direction: row-reverse; }
    .msg-wrapper.friend { align-self: flex-start; }

    .msg-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #475569; flex-shrink: 0; }
    .msg-bubble { padding: 10px 14px; border-radius: 14px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
    .mine .msg-bubble { background: var(--msg-mine); color: white; border-bottom-right-radius: 2px; }
    .friend .msg-bubble { background: var(--msg-friend); color: var(--text-main); border-bottom-left-radius: 2px; }

    /* Clickable Links & Media Embeds */
    .chat-link { color: #38bdf8; text-decoration: underline; word-break: break-all; }
    .msg-image, .msg-video { max-width: 320px; max-height: 240px; border-radius: 8px; margin-top: 8px; display: block; }
    .file-download-box { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 6px; margin-top: 6px; }
    .file-download-box a { color: var(--accent); text-decoration: none; font-weight: bold; font-size: 0.85rem; }

    .system-msg { align-self: center; font-size: 0.8rem; color: var(--text-muted); background: var(--panel-dark); padding: 4px 12px; border-radius: 12px; border: 1px solid var(--border-dark); }

    .chat-footer { padding: 16px; background: var(--panel-dark); border-top: 1px solid var(--border-dark); display: flex; gap: 10px; align-items: center; }
    .chat-footer input[type="text"] { flex: 1; padding: 12px; }

    .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-muted); flex-direction: column; gap: 10px; }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body class="theme-dark">

  <div class="app-container">
    <div class="sidebar">
      <div class="profile-section">
        <div class="profile-header">
          <img id="my-avatar-preview" class="avatar-preview" src="https://api.dicebear.com/7.x/bottts/svg?seed=Me" alt="Avatar">
          <div style="flex:1;">
            <input type="text" id="username-input" value="User" placeholder="Your Name">
            <div style="margin-top: 6px;">
              <label for="avatar-file" class="custom-file-upload">Upload Avatar</label>
              <input type="file" id="avatar-file" accept="image/*">
            </div>
          </div>
        </div>

        <div class="my-pin-badge">
          Your PIN: <span id="my-pin">Generating...</span>
        </div>

        <div class="inputs">
          <input type="text" id="join-pin-input" placeholder="Enter 6-Digit PIN" maxlength="6">
          <button class="btn" id="connect-btn">Connect & Open Tab</button>
        </div>

        <div class="theme-selector">
          <label for="theme-select">Theme:</label>
          <select id="theme-select" style="flex: 1;">
            <option value="theme-dark">Dark</option>
            <option value="theme-midnight">Midnight</option>
            <option value="theme-cyberpunk">Cyberpunk</option>
          </select>
        </div>
      </div>

      <div class="contacts-list" id="contacts-list"></div>
    </div>

    <div class="chat-window">
      <div class="empty-state" id="empty-state">
        <h2>No Active Chat Selected</h2>
        <p>Enter a 6-digit PIN on the left to start chatting.</p>
      </div>

      <div id="active-chat-content" style="display: none; height: 100%; flex-direction: column;">
        <div class="chat-header">
          <img id="active-avatar" class="avatar-preview" src="" alt="Avatar">
          <div>
            <div id="active-title" style="font-weight: bold;">Friend Name</div>
            <div id="active-status" style="font-size:0.75rem; color: var(--text-muted);">Connected</div>
          </div>
        </div>

        <div class="messages-container" id="messages-container"></div>

        <div class="chat-footer">
          <label for="chat-file-attachment" class="custom-file-upload">📎 Attachment</label>
          <input type="file" id="chat-file-attachment">
          <input type="text" id="message-input" placeholder="Type a message or paste link...">
          <button class="btn" id="send-btn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const originalTitle = "P2P WebRTC Chat";
    let unreadCount = 0;
    let peer = null;
    let chats = {};
    let activePeerId = null;
    let myAvatarData = "https://api.dicebear.com/7.x/bottts/svg?seed=Me";

    // Sound Notification
    function playNotificationSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch (e) {}
    }

    // Theme Switcher Handler
    document.getElementById('theme-select').addEventListener('change', (e) => {
      document.body.className = e.target.value;
    });

    // Generate PIN & Setup PeerJS
    const myPin = Math.floor(100000 + Math.random() * 900000).toString();
    document.getElementById('my-pin').textContent = myPin;
    peer = new Peer(myPin);

    // Optimized Compressed Avatar Upload
    document.getElementById('avatar-file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.src = evt.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 64;
            canvas.height = 64;
            ctx.drawImage(img, 0, 0, 64, 64);
            myAvatarData = canvas.toDataURL('image/jpeg', 0.7);
            document.getElementById('my-avatar-preview').src = myAvatarData;
            
            // Broadcast profile update immediately if in a chat
            if (activePeerId && chats[activePeerId]) {
              sendProfileInfo(chats[activePeerId].conn);
            }
          };
        };
        reader.readAsDataURL(file);
      }
    });

    // Handle PeerJS Connections
    peer.on('connection', (conn) => {
      setupChatSession(conn, false);
    });

    document.getElementById('connect-btn').addEventListener('click', () => {
      const pin = document.getElementById('join-pin-input').value.trim();
      if (pin.length === 6) {
        if (chats[pin]) {
          switchTab(pin);
          return;
        }
        const conn = peer.connect(pin);
        setupChatSession(conn, true);
        document.getElementById('join-pin-input').value = '';
      } else {
        alert("Enter a 6-digit PIN.");
      }
    });

    function sendProfileInfo(conn) {
      conn.send({
        type: 'profile-sync',
        username: document.getElementById('username-input').value.trim() || 'Anonymous',
        avatar: myAvatarData
      });
    }

    function setupChatSession(conn, isInitiator) {
      const targetId = conn.peer;

      chats[targetId] = {
        conn: conn,
        username: `PIN: ${targetId}`,
        avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=' + targetId,
        messages: [],
        unread: 0
      };

      createSidebarTab(targetId);

      conn.on('open', () => {
        addSystemMessage(targetId, "Connection established!");
        sendProfileInfo(conn); // Sync profile instantly on connect
        if (isInitiator) switchTab(targetId);
      });

      conn.on('data', (payload) => {
        if (payload.type === 'profile-sync') {
          chats[targetId].username = payload.username;
          chats[targetId].avatar = payload.avatar;
          updateTabUI(targetId);
          if (activePeerId === targetId) {
            document.getElementById('active-title').textContent = payload.username;
            document.getElementById('active-avatar').src = payload.avatar;
          }
          return;
        }

        chats[targetId].messages.push({ sender: 'friend', payload: payload });

        if (activePeerId === targetId && !document.hidden) {
          renderMessage(payload, false);
        } else {
          chats[targetId].unread++;
          updateTabUI(targetId);
          handleGlobalUnread();
        }
        playNotificationSound();
      });

      conn.on('close', () => {
        addSystemMessage(targetId, "Friend disconnected.");
      });
    }

    function createSidebarTab(peerId) {
      const list = document.getElementById('contacts-list');
      const tab = document.createElement('div');
      tab.classList.add('contact-tab');
      tab.id = `tab-${peerId}`;
      
      tab.innerHTML = `
        <img class="avatar-preview" id="avatar-${peerId}" src="${chats[peerId].avatar}">
        <div class="tab-info">
          <div class="tab-name" id="name-${peerId}">${chats[peerId].username}</div>
        </div>
        <div class="unread-badge" id="unread-${peerId}">0</div>
      `;

      tab.addEventListener('click', () => switchTab(peerId));
      list.insertBefore(tab, list.firstChild);
    }

    function updateTabUI(peerId) {
      const nameEl = document.getElementById(`name-${peerId}`);
      const avatarEl = document.getElementById(`avatar-${peerId}`);
      const unreadEl = document.getElementById(`unread-${peerId}`);

      if (nameEl) nameEl.textContent = chats[peerId].username;
      if (avatarEl) avatarEl.src = chats[peerId].avatar;
      if (unreadEl) {
        if (chats[peerId].unread > 0) {
          unreadEl.textContent = chats[peerId].unread;
          unreadEl.style.display = 'block';
        } else {
          unreadEl.style.display = 'none';
        }
      }
    }

    function switchTab(peerId) {
      activePeerId = peerId;
      chats[peerId].unread = 0;
      updateTabUI(peerId);

      document.querySelectorAll('.contact-tab').forEach(t => t.classList.remove('active'));
      document.getElementById(`tab-${peerId}`).classList.add('active');

      document.getElementById('empty-state').style.display = 'none';
      document.getElementById('active-chat-content').style.display = 'flex';

      document.getElementById('active-title').textContent = chats[peerId].username;
      document.getElementById('active-avatar').src = chats[peerId].avatar;

      const container = document.getElementById('messages-container');
      container.innerHTML = '';
      chats[peerId].messages.forEach(msg => {
        if (msg.system) renderSystemMsgUI(msg.text);
        else renderMessage(msg.payload, msg.sender === 'mine');
      });
      container.scrollTop = container.scrollHeight;
    }

    // Helper: Turn plain text URLs into clickable hyperlinks
    function formatLinks(text) {
      const urlPattern = /(https?:\/\/[^\s]+)/g;
      return text.replace(urlPattern, (url) => {
        return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="chat-link">${url}</a>`;
      });
    }

    // Message & File Dispatcher
    function sendMessage() {
      if (!activePeerId || !chats[activePeerId]) return;

      const textInput = document.getElementById('message-input');
      const fileInput = document.getElementById('chat-file-attachment');
      const text = textInput.value.trim();
      const file = fileInput.files[0];

      if (!text && !file) return;

      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          dispatchPayload(text, {
            name: file.name,
            type: file.type,
            data: e.target.result
          });
        };
        reader.readAsDataURL(file);
        fileInput.value = '';
      } else {
        dispatchPayload(text, null);
      }

      textInput.value = '';
    }

    function dispatchPayload(text, fileObj) {
      const payload = {
        type: 'chat-message',
        username: document.getElementById('username-input').value.trim() || 'Anonymous',
        avatar: myAvatarData,
        text: text,
        file: fileObj
      };

      chats[activePeerId].conn.send(payload);
      chats[activePeerId].messages.push({ sender: 'mine', payload: payload });
      renderMessage(payload, true);
    }

    document.getElementById('send-btn').addEventListener('click', sendMessage);
    document.getElementById('message-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Message Rendering Logic
    function renderMessage(payload, isMine) {
      const container = document.getElementById('messages-container');
      const wrapper = document.createElement('div');
      wrapper.classList.add('msg-wrapper', isMine ? 'mine' : 'friend');

      let textHTML = payload.text ? `<div>${formatLinks(payload.text)}</div>` : '';
      let fileHTML = '';

      if (payload.file) {
        const fileType = payload.file.type;
        if (fileType.startsWith('image/')) {
          fileHTML = `<img src="${payload.file.data}" class="msg-image"/>`;
        } else if (fileType.startsWith('video/')) {
          fileHTML = `<video src="${payload.file.data}" controls class="msg-video"></video>`;
        } else {
          fileHTML = `
            <div class="file-download-box">
              📄 <span>${payload.file.name}</span>
              <a href="${payload.file.data}" download="${payload.file.name}">Download</a>
            </div>`;
        }
      }

      wrapper.innerHTML = `
        <img class="msg-avatar" src="${payload.avatar}">
        <div>
          <div class="msg-bubble">
            ${textHTML}
            ${fileHTML}
          </div>
        </div>
      `;

      container.appendChild(wrapper);
      container.scrollTop = container.scrollHeight;
    }

    function addSystemMessage(peerId, text) {
      chats[peerId].messages.push({ system: true, text: text });
      if (activePeerId === peerId) renderSystemMsgUI(text);
    }

    function renderSystemMsgUI(text) {
      const container = document.getElementById('messages-container');
      const sysDiv = document.createElement('div');
      sysDiv.classList.add('system-msg');
      sysDiv.textContent = text;
      container.appendChild(sysDiv);
      container.scrollTop = container.scrollHeight;
    }

    function handleGlobalUnread() {
      if (document.hidden) {
        unreadCount++;
        document.title = `(${unreadCount}) ${originalTitle}`;
      }
    }

    window.addEventListener('focus', () => {
      unreadCount = 0;
      document.title = originalTitle;
    });
  </script>
</body>
</html>
