<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P WebRTC Chat</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --msg-my: #4f46e5;
      --msg-friend: #e5e7eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; padding: 20px; }
    
    .chat-container { width: 100%; max-width: 500px; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; display: flex; flex-direction: column; height: 90vh; }
    
    header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 15px; text-align: center; }
    header h2 { font-size: 1.2rem; color: var(--text-main); margin-bottom: 8px; }
    
    .profile-setup, .connection-setup { display: flex; gap: 8px; margin-bottom: 8px; }
    input { flex: 1; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.9rem; outline: none; }
    input:focus { border-color: var(--accent); }
    button { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: var(--accent-hover); }
    button:disabled { background: #9ca3af; cursor: not-allowed; }

    .room-info { background: #eeefef; padding: 8px; border-radius: 6px; text-align: center; font-size: 0.85rem; font-weight: bold; color: var(--text-muted); }
    .room-code { color: var(--accent); font-size: 1.1rem; letter-spacing: 2px; }

    #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #fafafa; }
    
    .system-msg { align-self: center; font-size: 0.75rem; background: #e5e7eb; color: var(--text-muted); padding: 4px 10px; border-radius: 12px; }

    .msg-wrapper { display: flex; gap: 8px; max-width: 80%; align-items: flex-end; }
    .msg-wrapper.mine { align-self: flex-end; flex-direction: row-reverse; }
    .msg-wrapper.friend { align-self: flex-start; }

    .avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #ccc; }
    .msg-bubble { padding: 10px 14px; border-radius: 16px; font-size: 0.9rem; word-break: break-word; }
    
    .mine .msg-bubble { background: var(--msg-my); color: white; border-bottom-right-radius: 2px; }
    .friend .msg-bubble { background: var(--msg-friend); color: var(--text-main); border-bottom-left-radius: 2px; }
    
    .sender-name { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 2px; display: block; }
    .mine .sender-name { text-align: right; }

    footer { padding: 12px; background: #fff; border-top: 1px solid #e5e7eb; display: flex; gap: 8px; }
  </style>
</head>
<body>

  <div class="chat-container">
    <header>
      <h2>P2P WebRTC Chat</h2>
      
      <div class="profile-setup">
        <input type="text" id="username-input" placeholder="Your Username" value="User">
        <input type="text" id="avatar-input" placeholder="Avatar Image URL (optional)">
      </div>

      <div class="connection-setup">
        <input type="text" id="join-pin-input" placeholder="Enter Friend's 6-Digit PIN" maxlength="6">
        <button id="connect-btn">Connect</button>
      </div>

      <div class="room-info">
        Your 6-Digit PIN: <span id="my-pin" class="room-code">Generating...</span>
      </div>
    </header>

    <div id="chat-box"></div>

    <footer>
      <input type="text" id="message-input" placeholder="Type a message..." disabled>
      <button id="send-btn" disabled>Send</button>
    </footer>
  </div>

  <script>
    const originalTitle = "P2P WebRTC Chat";
    let unreadCount = 0;
    let peer = null;
    let conn = null;

    // Helper: Generate random 6-digit PIN
    const myPin = Math.floor(100000 + Math.random() * 900000).toString();
    document.getElementById('my-pin').textContent = myPin;

    // Initialize PeerJS using the 6-Digit PIN as ID
    peer = new Peer(myPin);

    // DOM Elements
    const usernameInput = document.getElementById('username-input');
    const avatarInput = document.getElementById('avatar-input');
    const joinPinInput = document.getElementById('join-pin-input');
    const connectBtn = document.getElementById('connect-btn');
    const chatBox = document.getElementById('chat-box');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');

    peer.on('open', () => {
      appendSystemMsg(`Ready! Share your PIN: ${myPin}`);
    });

    // Handle Peer ID taken (Fallback safeguard)
    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        alert("PIN collision occurred. Reloading with a new PIN.");
        window.location.reload();
      } else {
        appendSystemMsg("Error: " + err.message);
      }
    });

    // Handle Incoming Connection (Host)
    peer.on('connection', (incomingConn) => {
      conn = incomingConn;
      setupConnection();
      appendSystemMsg("A friend connected to your room!");
    });

    // Handle Outgoing Connection (Joiner)
    connectBtn.addEventListener('click', () => {
      const pin = joinPinInput.value.trim();
      if (pin.length === 6) {
        appendSystemMsg(`Connecting to PIN ${pin}...`);
        conn = peer.connect(pin);
        setupConnection();
      } else {
        alert("Please enter a valid 6-digit PIN.");
      }
    });

    function setupConnection() {
      conn.on('open', () => {
        appendSystemMsg("Connected! You can now chat.");
        messageInput.disabled = false;
        sendBtn.disabled = false;
      });

      conn.on('data', (payload) => {
        // payload contains { username, avatar, text }
        appendMessage(payload, false);
        handleUnreadCount();
      });
    }

    // Send Message
    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !conn) return;

      const payload = {
        username: usernameInput.value.trim() || 'Anonymous',
        avatar: avatarInput.value.trim() || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + usernameInput.value,
        text: text
      };

      conn.send(payload);
      appendMessage(payload, true);
      messageInput.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // UI Helper: Render Chat Bubbles
    function appendMessage(data, isMine) {
      const wrapper = document.createElement('div');
      wrapper.classList.add('msg-wrapper', isMine ? 'mine' : 'friend');

      const avatarImg = document.createElement('img');
      avatarImg.classList.add('avatar');
      avatarImg.src = data.avatar;
      avatarImg.onerror = () => { avatarImg.src = 'https://api.dicebear.com/7.x/bottts/svg?seed=default'; };

      const msgBody = document.createElement('div');
      
      const senderSpan = document.createElement('span');
      senderSpan.classList.add('sender-name');
      senderSpan.textContent = data.username;

      const bubble = document.createElement('div');
      bubble.classList.add('msg-bubble');
      bubble.textContent = data.text;

      msgBody.appendChild(senderSpan);
      msgBody.appendChild(bubble);

      wrapper.appendChild(avatarImg);
      wrapper.appendChild(msgBody);

      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendSystemMsg(text) {
      const sysDiv = document.createElement('div');
      sysDiv.classList.add('system-msg');
      sysDiv.textContent = text;
      chatBox.appendChild(sysDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Title Notification Logic
    function handleUnreadCount() {
      if (document.hidden) {
        unreadCount++;
        document.title = `(${unreadCount}) ${originalTitle}`;
      }
    }

    window.addEventListener('focus', () => {
      unreadCount = 0;
      document.title = originalTitle;
    });
  </script>
</body>
</html>
